import groovy.json.JsonSlurper
import java.util.zip.ZipFile

// 对照本次编译的契约类全集；独立包既不能缺类，也不能反向依赖任一内容模组。
def packagePrefix = 'net/shiroha233/roadweaver/'
def expected = project(':api').sourceSets.main.output.classesDirs
def artifact = tasks.named('remapJar').flatMap { it.archiveFile }
tasks.register('verifyStandaloneApi') {
    group = 'verification'
    dependsOn tasks.named('remapJar')
    inputs.file(artifact)
    inputs.files(expected)
    doLast {
        Set classes = expected.files.findAll { it.isDirectory() }.collectMany { dir ->
            fileTree(dir).matching { include '**/*.class' }.files.collect {
                dir.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }
        } as Set
        File file = artifact.get().asFile
        new ZipFile(file).withCloseable { jar ->
            def metadata = new JsonSlurper().parse(jar.getInputStream(jar.getEntry('fabric.mod.json')), 'UTF-8')
            def entries = Collections.list(jar.entries())
            def ownClasses = entries*.name.findAll { it.startsWith(packagePrefix) && it.endsWith('.class') }
            if (classes.isEmpty() || ownClasses.size() != classes.size() || ownClasses.toSet() != classes
                    || metadata.id != 'roadweaver_api' || metadata.version != project.version.toString()
                    || metadata.entrypoints || metadata.mixins || metadata.jars
                    || metadata.depends.keySet() != (['fabricloader', 'minecraft', 'java'] as Set)) {
                throw new GradleException('独立前置缺少契约类或混入内容模组依赖')
            }
        }
        logger.lifecycle('[API-STANDALONE] PASS {}', file.name)
    }
}
tasks.named('check') { dependsOn tasks.named('verifyStandaloneApi') }
