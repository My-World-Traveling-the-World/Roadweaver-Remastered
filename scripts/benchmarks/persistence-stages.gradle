// 探针使用与回归相同的运行类路径；不把合成规模耗时当成游戏MSPT。
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':common')
    def out = p.layout.buildDirectory.dir('persistence-stage-probe')
    def compile = p.tasks.register('compilePersistenceStageProbe', JavaCompile) {
        dependsOn p.tasks.named('testClasses')
        source p.rootProject.files('scripts/benchmarks/ReadinessActiveProbe.java',
            'scripts/benchmarks/ReadinessWriteProbe.java', 'scripts/benchmarks/ConstructionLedgerProbe.java',
            'scripts/benchmarks/RoadValidationCacheProbe.java', 'scripts/benchmarks/BridgePairProbe.java',
            'scripts/benchmarks/RoadContentProbe.java', 'scripts/benchmarks/ShardStampProbe.java')
        classpath = p.sourceSets.test.runtimeClasspath
        destinationDirectory.set(out)
        options.encoding = 'UTF-8'
    }
    [readinessActiveProbe: 'planning.ReadinessActiveProbe', readinessWriteProbe: 'planning.ReadinessWriteProbe',
        constructionLedgerProbe: 'persistence.ConstructionLedgerProbe', roadValidationCacheProbe: 'pathlogic.validation.RoadValidationCacheProbe',
        bridgePairProbe: 'pathlogic.bridge.BridgePairProbe', roadContentProbe: 'pathlogic.metrics.RoadContentProbe',
        shardStampProbe: 'persistence.chunk.ShardStampProbe'].each { name, cls ->
        p.tasks.register(name, JavaExec) {
            dependsOn compile
            classpath = p.sourceSets.test.runtimeClasspath + p.files(out)
            mainClass = 'net.shiroha233.roadweaver.' + cls
            jvmArgs '-Xms512m', '-Xmx512m'
        }
    }
}
