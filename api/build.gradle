// 文件职责：绝对稳定、零内部依赖的对外契约模块。
//
// 本模块**只允许**出现：接口、枚举、常量、注册表、参数记录。
// **禁止** import net.shiroha233.roadweaver 下的任何非 api 包 —— 这是硬约束，
// 由 ApiModulePurityTest 在 roadweaver 侧钉住。
//
// 为什么禁止：历史上 roadweaver.api.interop 就是因为契约类与实现交织，
// 0.8.406 删掉实现时把契约一起删了，五个外部 mod 静默失效（见
// plaincraft-great-wall/build.gradle 第 20-29 行的记录）。契约与实现必须物理分离。
architectury {
    common("fabric")
}

dependencies {
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")
}

// 给**外部 mod** 用的契约 jar（named / Mojang 官方名）。
//
// 为什么不用 api/build/libs 里那个：architectury 的 common 工程不产出普通 jar，
// 只有 transformProductionFabric（已重映射成 intermediary，只能部署不能编译）。
// 外部 mod 的源码用官方名（ServerLevel / BlockPos），必须吃 named 版。
//
// 路径刻意不带版本号：外部工程要用固定相对路径引用它，
//   compileOnly files("../../roadweaver/api/build/contract/roadweaver-api-contract-named.jar")
// 版本变化只改内容不改路径，避免每次升版都要改所有外部工程的 build.gradle。
tasks.register('contractJar', Jar) {
    group = 'build'
    description = 'Named (Mojang-mapped) contract jar for external mods to compileOnly.'
    archiveBaseName = 'roadweaver-api-contract'
    archiveVersion = ''
    archiveClassifier = 'named'
    destinationDirectory = layout.buildDirectory.dir('contract')
    from sourceSets.main.output
}
