// 文件职责：把 api 契约模块打包成可独立加载的 Fabric mod（mod id `roadweaver_api`）。
//
// 为什么保持独立mod身份：随道路发布时由embedApiJar嵌入成品，无需玩家另装；
// 不装道路的下游仍可单独提供契约包，不能把“独立模块”误写成“必须双文件部署”。
//   1. 超速飞行 / chunky-autogen 等 mod 需要**实现**本契约的接口。若契约只存在于
//      roadweaver 主 jar，它们就必须硬依赖 roadweaver —— 不装道路就没法加载。
//   2. 独立部署后，消费方在 fabric.mod.json 里声明 depends: { "roadweaver_api": ">=1" }，
//      Fabric 加载期就会强制检查存在性 —— 缺了是**明确报错**，而不是运行期
//      NoClassDefFoundError。这正是历史上 roadweaver.api.interop 的失败点：
//      依赖方拿一个 compile-only 幽灵 jar 编译并测试，测试永远绿、运行时必炸。
plugins {
    id 'com.gradleup.shadow' version '8.3.6'
}

// 契约模块走**独立版本号**：它的 API 契约与道路主 mod 的版本节奏无关，
// 而且消费方的 fabric.mod.json 写的是 depends: roadweaver_api >= 1 ——
// 用道路那种 2.3.1-1.21.1-... 的长版本号去比 >=1 语义不清。
// 终态失败是向后兼容的新增能力；提高次版本避免加载器选中不含该方法的旧包。
version = '1.1.0'

architectury {
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    common(project(path: ":api", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":api", configuration: "transformProductionFabric")) { transitive = false }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

tasks.named('sourcesJar') {
    def commonSources = project(':api').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// 给**下游工程的开发期运行时**（dev run / gametest）用的可加载变体。
//
// 部署走 remapJar 的产物（intermediary）；但 dev 运行时需要 named（Mojang 官方名），
// 且下游工程的 gametest 会起一个真实 dev 服务器 —— 那里同样要校验 fabric.mod.json
// 的 depends，所以必须能把本契约 mod 真的装进 dev 运行时。
//
// 路径/文件名刻意不带版本号，下游用固定相对路径引用。
tasks.register('devModJar', Jar) {
    group = 'build'
    description = 'Loadable named variant of the api mod, for downstream dev runs and gametests.'
    archiveBaseName = 'roadweaver-api-fabric'
    archiveVersion = ''
    archiveClassifier = 'devmod'
    destinationDirectory = layout.buildDirectory.dir('contract')
    dependsOn project(':api').tasks.named('classes')
    from project(':api').sourceSets.main.output
    from sourceSets.main.output
}

// 给**用 intermediary 映射**的下游工程（如 tanshugetrees）用的契约 jar。
//
// 为什么需要第二份：本仓与多数下游用 officialMojangMappings（named），
// 但 tanshugetrees 的源码是从 intermediary 反编译重建的（class_3218 / class_2338），
// 拿 named 版给它会把 1824 处类型全对不上。remapJar 的产物正好是 intermediary 口径，
// 这里只是把它复制到不带版本号的稳定路径。
tasks.register('contractIntermediaryJar', Copy) {
    group = 'build'
    description = 'Intermediary-mapped contract jar for intermediary-source downstream mods.'
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('contract')
    rename { 'roadweaver-api-intermediary.jar' }
}
