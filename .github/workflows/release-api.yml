name: Release standalone RoadWeaver API
on:
  push:
    tags: ["api-v*.*.*"]
permissions:
  contents: write
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # 独立前置不配置道路本体，所以发布无需构建长城或河流。
      - run: bash ./gradlew -PapiOnly :api-fabric:build
      - name: Check tag matches the mod version
        id: artifact
        run: |
          artifact="api-fabric/build/libs/roadweaver-api-fabric-${GITHUB_REF_NAME#api-v}.jar"
          test -f "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: RoadWeaver API ${{ github.ref_name }}
          body: Independent Fabric library for Minecraft 1.21.1. Install one copy alongside any supported gameplay mod.
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
