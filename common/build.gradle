//   RoutePreloadTimingTest 只钉住了 decideReadiness 这个纯函数，但它赖以成立的
//   调用点事实（预加载只在连接**成功**回调里触发）没有任何测试守护 ——
//   若有人将来在失败分支也加一次触发，纯函数测试仍会全绿。
//   本守卫读源码文本断言调用点仍位于 `road() != null` 分支内。
registerMainRegression('routePreloadCallSiteGuard',
        'net.shiroha233.roadweaver.route.RoutePreloadCallSiteGuardTest')

// ★ 2026-09-26（WorkBuddy W-1/W-3）：手绘连接待施工数的**口径**回归。
