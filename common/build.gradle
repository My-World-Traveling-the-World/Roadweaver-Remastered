// 文件职责：配置 common 模块的共享源码、资源与单元测试依赖。
architectury {
    common("fabric")
}

dependencies {
    // Architectury API（作为 mod 依赖以启用 Loom 重映射）
    modImplementation("dev.architectury:architectury:${project.architectury_version}")
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")
    // 独立前置提供运行时接口；离线回归仍使用同一份 Mojang named 契约，避免错误映射。
    def apiContract = rootProject.worldgenApiArtifact("api/build/contract/roadweaver-api-contract-named.jar")
    compileOnly files(apiContract)
    testImplementation files(apiContract)
    // 长城接口（只有 1 个 class 的极小 jar；compileOnly，不进产物）
    //
    // ⚠ 这两个工程是**独立的**，道路仓库不收录长城的任何产物 ——
    //   所以这里引用邻居目录的构建输出，构建顺序是「先编长城 -> 再编道路」。
    //   代价是道路离开长城编不了，这是已知且接受的事实（见 docs/VALIDATION.md）。
    //
    // 但「缺 jar」时的报错必须说人话：原来只会看到
    //   WallRoadAdapter.java:35: 错误: 程序包 local.plaincraft.greatwall.api 不存在
    // 根本看不出是依赖没准备，所以这里显式检查一次。
    def greatWallInterop = rootProject.file(
            "../plaincraft-great-wall/build/interop/plaincraft-great-wall-interop.jar")
    if (!greatWallInterop.exists()) {
        throw new GradleException(
                "缺长城 interop jar：${greatWallInterop}\n" +
                "构建顺序要求「先编长城，再编道路」。请先执行：\n" +
                "  cd ../plaincraft-great-wall && gradle :interopJar\n" +
                "（道路与长城是两个独立仓库，道路不收录长城的任何产物。）")
    }
    compileOnly(files(greatWallInterop))
    // 纯Java的河流提供方契约，不把可选河流实现或契约重复打入道路成品。
    def streamsPlanApi = rootProject.file("../streams-reflowing-src/build/contract/streams-plan-api.jar")
    if (!streamsPlanApi.exists()) throw new GradleException("缺河流计划契约，请先在streams-reflowing-src执行planContractJar")
    compileOnly(files(streamsPlanApi))
    testImplementation(files(streamsPlanApi))

    // LWJGL OpenCL - 编译时依赖，运行时 native 由平台模块提供
    compileOnly("org.lwjgl:lwjgl-opencl:3.3.3")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testImplementation("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly("org.lwjgl:lwjgl:3.3.3")
    testRuntimeOnly("org.lwjgl:lwjgl-opencl:3.3.3")
    testRuntimeOnly("org.lwjgl:lwjgl:3.3.3:natives-windows")
    testRuntimeOnly("org.lwjgl:lwjgl:3.3.3:natives-linux")
    testRuntimeOnly("org.lwjgl:lwjgl:3.3.3:natives-macos")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    exclude '**/*'
}

// ⚠ registerMainRegression(taskName, testClass) 的第二个参数是**全限定类名**，
//   写错时不会在配置期报错，只会在真正跑这个任务时抛 ClassNotFoundException ——
//   于是任务"存在但不执行"，覆盖悄悄少掉一块。
//
//   2026-11-13 实测：本文件里有 7 个任务还写着重制前的旧包名
//     features.path.pathlogic.core.*   ->  现在在 pathlogic/{structures,validation,grade}
//     pathfinding.cache.opencl.*       ->  现在在 pathfinding/sampling/opencl
//   这 7 个 harness 共 101 处断言，因为类名错**从未执行过**。已全部修正。
// ── 手写自测的 JavaExec 入口 ────────────────────────────────────────────────
//
// ⚠️ 2026-11-15 状态说明（历史很重要，别误删也误留着）：
//
// 这些类都是「只有 public static void main、没有 @Test」的手写自测。
// 历史上它们**从不被执行** —— 标准 `test` 任务被 `exclude '**/*'` 关掉了，
// 而这里是唯一的入口，但没有人会记得手工敲 `gradle structureAvoidanceRegression`。
//
// 现在它们已经被 `SelfTestRunnerTest`（architecture 包）**全部接进
// `roadJUnitRegressionSuite`** —— 那个 runner 用反射逐个调用本清单里这些类的 main()，
// 所以常规验证（verify.ps1 → roadJUnitRegressionSuite）**已经覆盖到它们**。
//
// ⇒ 下面这些 JavaExec 任务保留的意义只剩「单独调试某一个自测」：
//     `gradle :common:roadBrakeRegression` 之类可以直接看它自己的完整 stdout。
//    **不是**必需的验证步骤；删掉不会造成覆盖缺口，但保留也无害。
//
// ⇒ 新增手写自测时请**只登记进 `SelfTestRunnerTest.SELF_TESTS`**（那才是回归入口）；
//    要不要在这里加 JavaExec 入口纯看是否需要单独调试。
//
// 判据（以后核查用）：测试目录下有 main、没有 @Test ⇒ 必须出现在
// `SelfTestRunnerTest.SELF_TESTS` 里；本文件的任务清单不是权威名单。

def registerMainRegression = { String taskName, String testClass ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = testClass
        // 源码守卫和契约 JAR 查找走同一配置，避免扫描到同名旧目录。
        systemProperty 'roadweaver.worldgenApiRoot', rootProject.worldgenApiRoot.absolutePath
    }
}

