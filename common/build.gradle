// ★ 2026-09-26：手绘路线「预加载就绪判定」的时序仿真回归。
//   0.8.391 的强制加载在**同一处连出过两次 P1**，根因都是
//   「用触发次数推断连接状态」这个错误映射：
//     ① 过早预加载 ⇒ 空计划被永久标记为"无需施工"；
//     ② 等待上限永不可达（失败连接不触发）⇒ 整条路线永不预加载。
//   真机上"恰好某条连接失败"极难复现，所以把判定抽成纯函数后在此穷举钉住。
registerMainRegression('routePreloadTimingRegression',
        'net.shiroha233.roadweaver.route.RoutePreloadTimingTest')

// ★ 2026-09-26：「IO 失败 ≠ 数据损坏」不变量的回归。
//   WorkBuddy 分析出的两个 P1（R-4 结构表 / R-5 道路索引）根因相同 ——
//   把 IOException 误判成"文件损坏"，用空数据覆盖真数据。
//   修法都是「IO 失败 → 只读降级」。本测试钉住该修法依赖的两个底层性质：
//     ① 原子写不留半成品/临时残留
//     ② quarantineCorrupt 只重命名、内容逐字节不变（⇒ 误隔离仍可人工恢复）
registerMainRegression('ioNotCorruptionRegression',
        'net.shiroha233.roadweaver.persistence.files.IoNotCorruptionTest')

