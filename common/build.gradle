// ★ 0.8.400：手绘路线**预加载兜底链路**的静态守卫。
//   「提交后强制加载区块」在同一处连出过三次 P1，前两次是判据错，
//   第三次是**触发链静默断裂**（4 跳异步链里 epoch 失效会丢弃整个动作，
//   路能建好但区块一次都不加载，且日志无任何错误）。
//   0.8.400 改为 tick 驱动兜底后，本测试钉住三条易被重构破坏的架构事实：
//     ① submit 必须登记待办（否则兜底永不唤醒）
//     ② drainPending 必须在暂停 return 之前（否则开地图时兜底永不执行 —— W-1 同形状）
//     ③ 检测间隔必须是 10 tick = 0.5 秒（用户要求，降低性能压力）
registerMainRegression('routePreloadFallbackGuard',
        'net.shiroha233.roadweaver.route.RoutePreloadFallbackGuardTest')

// ★ 0.8.401：checkpoint 内存缓存的回归。
//   真机 3× jstack 证明 Chunky 预热期服务端线程**全部**卡在
//   InitialGenerationCheckpointStore 的磁盘读取上（每 tick 约 1.1 万次文件打开）。
//   本测试钉住修复依赖的三条不变量：重复读不触盘 / 写后失效 / 按 key 隔离。
registerMainRegression('checkpointCacheRegression',
        'net.shiroha233.roadweaver.persistence.files.CheckpointCacheTest')

// ★ 0.8.401：Chunky 预热期「不得被压力限速」的静态守卫。
//   该不变量已被反复破坏三次（0.8.372 开满 12 lanes / 0.8.373 readyAhead 互锁 /
//   0.8.399 之前预热分支根本不存在、被 clampGameplayThreadCap 钳在 2）。
//   缺陷本质是**分支顺序**，顺序错了代码依然编译通过、看起来正常 —— 故用文本断言钉住。
registerMainRegression('preflightExemptionGuard',
        'net.shiroha233.roadweaver.runtime.PreflightExemptionGuardTest')

// ★ 0.8.402：GPU 粗采样 lane 数的整数截断边界回归。
//   真机 RTX 4060 上报 8188 MiB = 7.996 GiB，(int)(7.996/4) = 1 —— 差 4 MiB 少一半并行度。
//   本测试钉住「必须四舍五入」+ 「源码不得退回截断写法」。
registerMainRegression('coarseLaneCountBoundary',
        'net.shiroha233.roadweaver.pathfinding.sampling.opencl.CoarseLaneCountBoundaryTest')

// ★ 0.9.027：落盘中心线审计台（离线回归尺子）。
//   读存档里 RoadWeaver 持久化的路面 NBT，把「这条路实际长成什么样」压成可比较的数字：
//   弯曲系数 / 横向抖动 / 转向角 / DP 剥离 / 宏观反转。在此之前后处理改动没有任何客观尺子 ——
//   `route SHAPE` 只覆盖当次规划、`route QUALITY` 没有弯曲系数与横向抖动、
//   唯一的角度判据 SHARP_TURN_DEG=90 又是严格大于 90 而实际转向角恰好 45/90 ⇒ 结构性抓不到。
//   跑法示例：:common:roadCenterlineAudit -PrqArgs="--save <存档目录> --all"
//             :common:roadCenterlineAudit -PrqArgs="--save <存档目录> --window -700,-560,180,340 --ascii"
registerMainRegression('roadCenterlineAudit',
        'net.shiroha233.roadweaver.tuning.RoadCenterlineAudit')
tasks.named('roadCenterlineAudit', JavaExec).configure {
    String rqArgs = (project.findProperty('rqArgs') ?: '').toString().trim()
    if (!rqArgs.isEmpty()) {
        args rqArgs.split('\\s+').toList()
    }
}

